<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f7f5f0">
    <meta name="description" content="A little corner of the internet. Hello, world!">
    <title>Hello, world!</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #f7f5f0;
        color: #20231f;
        font-synthesis: none;
        text-rendering: optimizeLegibility;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-width: 320px;
        min-height: 100vh;
        margin: 0;
      }

      main {
        display: grid;
        min-height: 100vh;
        place-items: center;
        padding: 2rem;
      }

      .welcome {
        width: min(100%, 760px);
        padding: clamp(2rem, 8vw, 5.5rem);
        border: 1px solid #e8e4da;
        border-radius: 1.5rem;
        background: #fffefa;
        box-shadow: 0 24px 80px rgb(46 43 34 / 7%);
      }

      .eyebrow {
        margin: 0 0 1.5rem;
        color: #64805e;
        font-size: 0.8rem;
        font-weight: 700;
        letter-spacing: 0.16em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0;
        font-size: clamp(3rem, 10vw, 6.5rem);
        font-weight: 650;
        letter-spacing: -0.075em;
        line-height: 0.98;
      }

      h1 span {
        color: #64805e;
      }

      .intro {
        max-width: 34rem;
        margin: 1.5rem 0 0;
        color: #686a62;
        font-size: clamp(1rem, 2.5vw, 1.2rem);
        line-height: 1.7;
      }

      .footer {
        display: flex;
        align-items: center;
        gap: 0.6rem;
        margin-top: 3rem;
        color: #85867e;
        font-size: 0.85rem;
      }

      .dot {
        width: 0.5rem;
        height: 0.5rem;
        border-radius: 50%;
        background: #91a786;
      }
    </style>
  </head>
  <body>
    <main>
      <section class="welcome" aria-labelledby="welcome-heading">
        <p class="eyebrow">A little corner of the internet</p>
        <h1 id="welcome-heading">Hello,<br><span>world!</span></h1>
        <p class="intro">A fresh start, a blank page, and plenty of room to grow. Thanks for stopping by.</p>
        <div class="footer"><span class="dot" aria-hidden="true"></span>Made for what comes next</div>
      </section>
    </main>
  </body>
</html>
